<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d3b4f">
<title>AquaPrint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0d2b38; --ink2:#4a6572; --bg:#f3f8f9; --card:#fff; --line:#dbe8ec;
  --deep:#0d3b4f; --water:#1c8fb8; --water-mid:#7cc3dc; --water-soft:#d7eef6; --blue:#1565c0;
  --gA:#0b7a75; --gB:#3aa17e; --gC:#e2b021; --gD:#ec8a35; --gE:#d64545;
  --r:18px; --shadow:0 1px 2px rgba(13,43,56,.06),0 6px 20px rgba(13,43,56,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));}
body.noscroll{overflow:hidden}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;margin:0;letter-spacing:-.01em}
h1{font-size:1.75rem;line-height:1.15}
h2{font-size:1.25rem;line-height:1.2}
h3{font-size:1.02rem;margin-bottom:.5rem}
a{color:var(--water)}
.small{font-size:.84rem;color:var(--ink2);line-height:1.45}
.center{text-align:center}
.hidden{display:none!important}
header{position:sticky;top:0;z-index:5;background:var(--deep);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 18px 10px;
  display:flex;align-items:center;gap:10px}
header .logo{width:30px;height:30px;color:#7fd6f0}
header .name{font-family:'Fraunces',serif;font-size:1.3rem;font-weight:700;letter-spacing:-.01em}
header .name span{color:#7fd6f0}
header .tag{margin-left:auto;font-size:.72rem;opacity:.75;text-align:right;line-height:1.2}
main{max-width:560px;margin:0 auto;padding:18px 16px 24px}
.lede{color:var(--ink2);margin:.4rem 0 1rem}
.card{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin:14px 0}
.btn{appearance:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-weight:500;padding:11px 16px;border-radius:12px;cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--water);border-color:var(--water);color:#fff}
.btn.ghost{background:transparent}
.btn:active{transform:scale(.98)}
.linkbtn{background:none;border:0;color:var(--water);font:inherit;font-weight:500;padding:6px 0;cursor:pointer}
/* scan */
.camera{position:relative;background:var(--deep);border-radius:var(--r);min-height:250px;overflow:hidden;display:flex;align-items:center;justify-content:center}
#reader{width:100%}
#reader video{width:100%!important;display:block}
.cam-idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#cdeaf3}
.cam-idle svg{width:46px;height:46px;color:#7fd6f0}
.cam-idle .small{color:#a9cbd6}
.stopcam{position:absolute;top:10px;right:10px;background:rgba(255,255,255,.9)}
.alt{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.manual{display:flex;gap:8px}
.manual input,.quick input,.quick select{flex:1;min-width:0;font:inherit;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.quick select{flex:2 1 180px}.quick input{flex:1 1 80px}
.msg{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:.92rem;line-height:1.45}
.msg.info{background:var(--water-soft)}
.msg.warn{background:#fff4e0;border:1px solid #f5d9a6}
.demo{margin-top:20px}
.demo h3{font-size:.95rem;color:var(--ink2);font-family:'DM Sans',sans-serif;font-weight:700;text-transform:uppercase;letter-spacing:.04em;font-size:.75rem}
.chip{display:inline-block;margin:0 6px 8px 0;padding:9px 13px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:.9rem;cursor:pointer;color:var(--ink)}
/* result */
.back{background:none;border:0;font:inherit;color:var(--water);font-weight:500;padding:0 0 10px;cursor:pointer}
.phead{display:flex;gap:12px;align-items:center}
.phead img,.phead .emoji{width:64px;height:64px;border-radius:14px;object-fit:contain;background:#fff;box-shadow:var(--shadow);flex:none;display:flex;align-items:center;justify-content:center;font-size:34px}
.hero{padding-top:18px}
.rating-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.rscale{display:inline-flex;border-radius:10px;overflow:hidden}
.rscale span{width:26px;height:30px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;opacity:.35;font-size:.85rem}
.rscale span.on{opacity:1;transform:scale(1.22);border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.25);z-index:1;font-size:1.05rem}
.rscale.big span{width:32px;height:38px}
.gA{background:var(--gA)}.gB{background:var(--gB)}.gC{background:var(--gC)}.gD{background:var(--gD)}.gE{background:var(--gE)}
.rlabel{display:flex;flex-direction:column}
.rlabel span{font-size:.82rem;color:var(--ink2)}
.badge{display:inline-flex;width:26px;height:26px;border-radius:8px;color:#fff;font-weight:700;align-items:center;justify-content:center;font-size:.85rem;flex:none}
.segs{display:flex;background:var(--bg);border-radius:12px;padding:4px;margin:16px 0 10px}
.seg{flex:1;border:0;background:none;font:inherit;font-size:.9rem;padding:8px;border-radius:9px;cursor:pointer;color:var(--ink2)}
.seg.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.seg:disabled{opacity:.35}
.big{font-family:'Fraunces',serif;font-size:2.1rem;font-weight:700;color:var(--deep);line-height:1.1}
.sub{color:var(--ink2);font-size:.9rem;margin-top:4px}
.bluebox{display:flex;gap:10px;margin-top:14px;padding:12px;border-radius:12px;background:#eaf2fd;font-size:.88rem;line-height:1.45}
.bluebox .dot{width:12px;height:12px;border-radius:50%;background:var(--blue);flex:none;margin-top:4px}
.compare{margin-top:16px;border-top:1px dashed var(--line);padding-top:14px}
.compare-head{font-size:1rem}
.icons{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 6px;color:var(--deep)}
.vessel{width:64px;height:auto}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--ink2)}
.legend .sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.sw.solid{background:var(--water)}
.sw.hatch{background:repeating-linear-gradient(45deg,var(--water-mid) 0 2px,var(--water-soft) 2px 5px)}
.others{list-style:none;padding:0;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:6px}
.others li{font-size:.8rem;background:var(--bg);padding:5px 9px;border-radius:999px;color:var(--ink2)}
.others b{color:var(--ink)}
.swapbtn{width:100%;background:linear-gradient(135deg,#0b7a75,#1c8fb8);color:#fff;border:0;padding:15px;font-weight:700;font-size:1rem;margin-top:4px;flex-wrap:wrap}
.swapbtn .save{font-weight:500;opacity:.9;font-size:.85rem}
.actions{display:flex;gap:10px;margin-top:10px}
.actions .btn{flex:1}
.bars{display:flex;flex-direction:column;gap:12px}
.bar-l{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.bar-l em{color:var(--ink2);font-size:.8rem}
.bar-t{position:relative;height:10px;background:var(--bg);border-radius:6px;margin-top:5px;overflow:hidden}
.bar-t i{position:absolute;left:0;top:0;bottom:0;background:var(--water-mid);border-radius:6px}
.bar-t i.blue{background:var(--blue)}
.bar-s{font-size:.75rem;color:var(--ink2);margin-top:3px}
.key{display:inline-block;width:10px;height:10px;border-radius:3px;margin:0 4px 0 10px;vertical-align:-1px}
.key.k1{background:var(--water-mid);margin-left:0}.key.k2{background:var(--blue)}
.nut{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.nut div{background:var(--bg);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column}
.nut b{font-size:1.1rem}.nut span{font-size:.75rem;color:var(--ink2)}
.conf{border-left:5px solid var(--gB)}
.conf.c-medium{border-left-color:var(--gC)}.conf.c-low{border-left-color:var(--gE)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(8,30,40,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.modal{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  position:relative;animation:up .28s cubic-bezier(.2,.8,.2,1)}
@media(min-width:640px){.modal-bg{align-items:center}.modal{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.x{position:absolute;top:12px;right:12px;border:0;background:#fff;width:36px;height:36px;border-radius:50%;font-size:1.4rem;cursor:pointer;box-shadow:var(--shadow)}
.mhead{display:flex;gap:10px;align-items:center;margin-bottom:6px;padding-right:40px}
.mhead svg{width:34px;height:34px;color:var(--water);flex:none}
.scard{background:#fff;border-radius:var(--r);padding:16px;margin-top:12px;box-shadow:var(--shadow);position:relative}
.scard.best{border:2px solid var(--gA)}
.scard .tag{position:absolute;top:-10px;left:14px;background:var(--gA);color:#fff;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px}
.swaplist{margin:6px 0 10px;padding-left:18px;font-size:.9rem}
.svs{display:flex;align-items:center;gap:8px;background:var(--bg);border-radius:12px;padding:10px}
.svs>div{flex:1;display:flex;flex-direction:column;gap:3px}
.svs span{font-size:.75rem;color:var(--ink2)}
.svs .arrow{flex:none;font-size:1.3rem;color:var(--ink2)}
.saving{margin:10px 0;font-size:.92rem}
.ntab{width:100%;border-collapse:collapse;font-size:.88rem;margin-bottom:6px}
.ntab th{font-size:.75rem;color:var(--ink2);text-align:right;font-weight:500}
.ntab td{padding:5px 0;border-top:1px solid var(--line);text-align:right}
.ntab td:first-child{text-align:left}
.ntab td.up{color:var(--gA);font-weight:700}.ntab td.down{color:var(--gD);font-weight:700}
.addswap{width:100%;margin-top:6px}
/* list */
.empty{text-align:center;padding:40px 10px;color:var(--ink2)}
.empty svg{width:50px;height:50px;color:var(--water-mid)}
.total .big{font-size:1.8rem;margin-top:4px}
.potential{margin-top:12px;background:#e6f5ef;padding:10px 12px;border-radius:12px;font-size:.9rem}
.items{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.li-m{flex:1;min-width:0;display:flex;flex-direction:column}
.li-m b{font-size:.92rem;font-weight:500}
.li-m span{font-size:.8rem;color:var(--ink2)}
.li-m .linkbtn{text-align:left;font-size:.82rem;padding:4px 0 0}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font-size:1rem;cursor:pointer}
.qty span{min-width:18px;text-align:center;font-weight:700}
/* method */
.method p{line-height:1.55;margin:.3rem 0}
.rtab td{padding:4px 10px 4px 0;font-size:.9rem}
details summary{cursor:pointer;list-style:none}
details summary h3{display:inline}
details summary::after{content:' ▾';color:var(--ink2)}
.tscroll{overflow-x:auto;margin-top:10px}
.wtab{border-collapse:collapse;font-size:.78rem;width:100%}
.wtab th{text-align:left;color:var(--ink2);font-weight:500;padding:4px 6px}
.wtab td{border-top:1px solid var(--line);padding:5px 6px;vertical-align:top}
.wtab td:nth-child(2),.wtab td:nth-child(3){text-align:right;white-space:nowrap}
.wtab td.src{color:var(--ink2);min-width:160px}
.src-list li{margin-bottom:6px}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;z-index:10;padding-bottom:env(safe-area-inset-bottom)}
.tab{flex:1;max-width:186px;border:0;background:none;font:inherit;font-size:.78rem;color:var(--ink2);padding:9px 0 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--water);font-weight:700}
#listCount{position:absolute;top:4px;left:calc(50% + 6px);background:var(--gE);color:#fff;font-size:.66rem;border-radius:999px;padding:1px 6px;font-weight:700}
#listCount:empty{display:none}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--deep);color:#fff;padding:10px 16px;border-radius:999px;
  font-size:.9rem;opacity:0;transition:.25s;pointer-events:none;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5C9 7 5.5 10.6 5.5 14.6a6.5 6.5 0 0 0 13 0C18.5 10.6 15 7 12 2.5z" fill="currentColor"/><path d="M9 14.5c.2 1.6 1.3 2.7 2.9 2.9" fill="none" stroke="#0d3b4f" stroke-width="1.6" stroke-linecap="round"/></svg>
  <div class="name">Aqua<span>Print</span></div>
  <div class="tag">Know the water<br>behind your food</div>
</header>
<main id="main"></main>
<nav>
  <button class="tab" data-view="scan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M8 8v8M11 8v8M14 8v8M17 8v8"/></svg>Scan</button>
  <button class="tab" data-view="list"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.2" fill="currentColor"/><circle cx="4.5" cy="12" r="1.2" fill="currentColor"/><circle cx="4.5" cy="18" r="1.2" fill="currentColor"/></svg>My list<span id="listCount"></span></button>
  <button class="tab" data-view="method"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>How it works</button>
</nav>
<div class="toast" id="toast"></div>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" onerror="var s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';document.head.appendChild(s)"></script>
<script>
/* ===== AquaPrint engine: data + calculations (no DOM) ===== */
(function (root) {
'use strict';

/* ---------- 1. Water footprint table ----------
   [green, blue, grey] litres per kg, global averages 1996-2005.
   Crops: Mekonnen & Hoekstra (2011) Hydrol. Earth Syst. Sci. 15:1577 / UNESCO-IHE Value of Water Report 47, Table 4.
   Animal products: Mekonnen & Hoekstra (2012) Ecosystems 15:401 / Value of Water Report 48, Table 4.
   band: production-variability family (see BANDS). note: shown on the method screen. */
const SRC_CROP = 'Mekonnen & Hoekstra 2011 (Report 47)';
const SRC_ANIM = 'Mekonnen & Hoekstra 2012 (Report 48)';
const DERIVED = 'AquaPrint derivation from ' ;

const WF = {
  water:        { label: 'Water', g: 0, b: 0, y: 0, band: 'none', src: 'Added water is not counted (it is not an agricultural input)' },
  wheat_flour:  { label: 'Wheat flour', g: 1292, b: 347, y: 210, band: 'crop', src: SRC_CROP },
  pasta:        { label: 'Pasta / durum semolina (dry)', g: 1292, b: 347, y: 210, band: 'crop', src: SRC_CROP },
  bread:        { label: 'Wheat bread', g: 1124, b: 301, y: 183, band: 'crop', src: SRC_CROP },
  rice:         { label: 'Rice, white (milled)', g: 1710, b: 509, y: 278, band: 'crop', src: SRC_CROP + ' – "rice, broken" used as milled-rice proxy' },
  brown_rice:   { label: 'Rice, brown', g: 1488, b: 443, y: 242, band: 'crop', src: SRC_CROP },
  maize:        { label: 'Corn / maize', g: 947, b: 81, y: 194, band: 'crop', src: SRC_CROP },
  corn_deriv:   { label: 'Corn starch / corn syrup / glucose', g: 1420, b: 122, y: 291, band: 'crop', src: DERIVED + 'maize (≈1.5 kg maize per kg starch or syrup solids)' },
  oats:         { label: 'Oats', g: 1479, b: 181, y: 128, band: 'crop', src: SRC_CROP },
  barley:       { label: 'Barley / malt', g: 1213, b: 79, y: 131, band: 'crop', src: SRC_CROP },
  soy:          { label: 'Soybeans / soy flour / soy protein', g: 2037, b: 70, y: 37, band: 'crop_wide', src: SRC_CROP + ' – soybean value; processed soy protein has a wider band' },
  lentils:      { label: 'Lentils (dry)', g: 4324, b: 489, y: 1060, band: 'crop', src: SRC_CROP },
  lentils_cooked:{ label: 'Lentils (cooked)', g: 1730, b: 196, y: 424, band: 'crop', src: DERIVED + 'dry lentils (÷2.5 for cooked weight)' },
  chickpeas:    { label: 'Chickpeas (dry)', g: 2972, b: 224, y: 981, band: 'crop', src: SRC_CROP },
  beans:        { label: 'Beans (dry)', g: 3945, b: 125, y: 983, band: 'crop', src: SRC_CROP },
  beans_cooked: { label: 'Beans (cooked/canned)', g: 1644, b: 52, y: 410, band: 'crop', src: DERIVED + 'dry beans (÷2.4 for cooked weight)' },
  peas:         { label: 'Peas (dry)', g: 1453, b: 33, y: 493, band: 'crop', src: SRC_CROP },
  peanuts:      { label: 'Peanuts', g: 3526, b: 214, y: 234, band: 'crop', src: SRC_CROP + ' – groundnuts, shelled' },
  almonds:      { label: 'Almonds', g: 9264, b: 3816, y: 3015, band: 'nut', src: SRC_CROP + ' – shelled' },
  cashews:      { label: 'Cashews', g: 12853, b: 921, y: 444, band: 'nut', src: SRC_CROP },
  walnuts:      { label: 'Walnuts', g: 5610, b: 2598, y: 1628, band: 'nut', src: DERIVED + 'walnuts in shell (×2 for shelled kernels)' },
  pistachios:   { label: 'Pistachios', g: 3095, b: 7602, y: 666, band: 'nut', src: SRC_CROP },
  hazelnuts:    { label: 'Hazelnuts', g: 7626, b: 2180, y: 708, band: 'nut', src: DERIVED + 'hazelnuts in shell (×2 for kernels)' },
  sunflower:    { label: 'Sunflower seeds', g: 3017, b: 148, y: 201, band: 'crop', src: SRC_CROP },
  raisins:      { label: 'Raisins', g: 1700, b: 386, y: 347, band: 'crop', src: SRC_CROP + ' – grapes, dried' },
  grapes:       { label: 'Grapes', g: 425, b: 97, y: 87, band: 'crop', src: SRC_CROP },
  tomatoes:     { label: 'Tomatoes', g: 108, b: 63, y: 43, band: 'crop', src: SRC_CROP },
  tomato_paste: { label: 'Tomato paste', g: 431, b: 253, y: 171, band: 'crop', src: SRC_CROP },
  tomato_puree: { label: 'Tomato purée', g: 216, b: 127, y: 86, band: 'crop', src: DERIVED + 'tomato paste (purée ≈ half the concentration of paste)' },
  ketchup:      { label: 'Ketchup', g: 270, b: 158, y: 107, band: 'crop', src: SRC_CROP },
  potatoes:     { label: 'Potatoes', g: 191, b: 33, y: 63, band: 'crop', src: SRC_CROP },
  sugar:        { label: 'Sugar (cane, refined)', g: 1184, b: 487, y: 111, band: 'crop', src: SRC_CROP },
  beet_sugar:   { label: 'Sugar (beet)', g: 535, b: 167, y: 162, band: 'crop', src: SRC_CROP },
  cocoa_mass:   { label: 'Cocoa mass / chocolate liquor', g: 24015, b: 5, y: 218, band: 'tropical', src: SRC_CROP + ' – cocoa paste' },
  cocoa_butter: { label: 'Cocoa butter', g: 33626, b: 7, y: 305, band: 'tropical', src: SRC_CROP },
  cocoa_powder: { label: 'Cocoa powder', g: 15492, b: 3, y: 141, band: 'tropical', src: SRC_CROP },
  chocolate:    { label: 'Chocolate (dark)', g: 16805, b: 198, y: 193, band: 'tropical', src: SRC_CROP },

/* ---------- 9. Barcode helpers ---------- */
function normalizeBarcode(code) {
  const d = String(code || '').replace(/\D/g, '');
  if (d.length === 12) return '0' + d;          // UPC-A → EAN-13
  if (d.length === 8 || d.length === 13 || d.length === 14) return d;
  return d;
}

/* ---------- 10. Turn an Open Food Facts product into AquaPrint ingredient leaves ---------- */
function flattenOFF(ings, parentPct, depth) {
  const out = [];
  if (!Array.isArray(ings)) return out;
  // Are child percentages relative to the product or to the parent?
  let childSum = 0; for (const i of ings) childSum += +i.percent_estimate || 0;
  const relToParent = parentPct != null && childSum > 0 && Math.abs(childSum - 100) < Math.abs(childSum - parentPct);
  const scale = relToParent ? parentPct / 100 : 1;
  for (const i of ings) {
    const est = (+i.percent_estimate || 0) * scale;
    const text = i.text || (i.id || '').replace(/^[a-z]{2}:/, '').replace(/-/g, ' ');
    const directKey = matchIngredient(i.id) || matchIngredient(i.text);
    const hasKids = Array.isArray(i.ingredients) && i.ingredients.length && depth < 3;
    const keepWhole = directKey && ['almond_drink', 'oat_drink', 'soy_drink', 'choc_candies', 'milk_chocolate', 'chocolate', 'pasta', 'bread', 'cheese', 'tomato_puree', 'tomato_paste'].includes(directKey);
    if (hasKids && !keepWhole) {
      const kids = flattenOFF(i.ingredients, est, depth + 1);
      const kidSum = kids.reduce((a, k) => a + k.pct, 0);
      if (kidSum > 0.5 * est || !directKey) { out.push(...kids); continue; }
    }
    let min = i.percent_min != null ? +i.percent_min * scale : null;
    let max = i.percent_max != null ? +i.percent_max * scale : null;
    if (i.percent != null) { min = max = +i.percent * scale; }
    out.push({ text, key: directKey, pct: est, min, max, declared: i.percent != null });
  }
  return out;
}

function fromOFF(p) {
  const code = normalizeBarcode(p.code);
  const name = p.product_name_en || p.product_name || p.generic_name || 'Unknown product';
  const brand = (p.brands || '').split(',')[0].trim();
  const cur = CURATED[code] || curatedByName(name, brand);
  if (cur) return Object.assign({ code, curated: true, image: p.image_front_small_url || p.image_front_url || null }, cur);

  let grams = +p.product_quantity || null;
  const n = p.nutriments || {};
  const servingQ = +p.serving_quantity || null;
  const pick = (k) => {
    const per100 = n[k + '_100g'];
    const perServ = n[k + '_serving'];
    if (servingQ && perServ != null) {
      const fromServ = perServ / servingQ * 100;
      if (per100 == null || (fromServ > 0 && Math.abs(per100 - fromServ) / fromServ > 0.5)) return fromServ;
    }
    return per100 != null ? +per100 : null;
  };
  const nutrition100 = { kcal: pick('energy-kcal'), protein: pick('proteins'), fibre: pick('fiber'), carbs: pick('carbohydrates'), fat: pick('fat'), sugars: pick('sugars') };
  let ingredients = flattenOFF(p.ingredients || [], null, 0);
  let fallback = null;
  if (!ingredients.length) {
    const cats = (p.categories_tags || []).slice().reverse();
    for (const c of cats) { const hit = CATEGORY_FALLBACK.find(([re]) => re.test(c)); if (hit) { fallback = hit[1]; break; } }
    if (fallback) ingredients = [{ text: WF[fallback].label + ' (estimated from product category)', key: fallback, pct: 100, min: 70, max: 100 }];
  }
  return {
    code, curated: false, name, brand, category: (p.categories || '').split(',').slice(-1)[0].trim(),
    image: p.image_front_small_url || p.image_front_url || null, emoji: '🛒',
    grams, servingGrams: servingQ, servingLabel: p.serving_size || (servingQ ? servingQ + ' g' : null),
    nutrition100, ingredients, categoryFallback: !!fallback,
    shareNote: fallback ? 'No ingredient list in Open Food Facts – estimated from the product category (low confidence).'
                        : 'Ingredient shares from Open Food Facts estimates (min–max ranges used where available).'
  };
}

/* ---------- 11. Monte Carlo footprint ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function tri(r, a, c, b) { if (a === b) return c; const u = r(); const f = (c - a) / (b - a); return u < f ? a + Math.sqrt(u * (b - a) * (c - a)) : b - Math.sqrt((1 - u) * (b - a) * (b - c)); }
function pctile(sorted, p) { const i = (sorted.length - 1) * p; const lo = Math.floor(i), hi = Math.ceil(i); return sorted[lo] + (sorted[hi] - sorted[lo]) * (i - lo); }

const UNKNOWN_WF = [300, 1500, 4000]; // L/kg triangular for unrecognised major ingredients

function prepLeaves(ingredients) {
  return ingredients.filter(l => l.pct > 0 || l.max > 0).map(l => {
    let lo = l.min, hi = l.max;
    if (lo == null || hi == null || hi - lo > 40 || hi < lo) { lo = l.pct * 0.6; hi = l.pct * 1.4; }
    lo = Math.max(0, Math.min(lo, l.pct)); hi = Math.max(hi, l.pct);
    return Object.assign({}, l, { lo, hi });
  });
}

function footprint(product, opts) {
  opts = opts || {};
  const leaves = prepLeaves(product.ingredients);
  const totalPct = leaves.reduce((a, l) => a + l.pct, 0) || 100;
  // central (deterministic) per kg
  let central = 0, centralBlue = 0, unknownPct = 0, minorPct = 0;
  const contrib = [];
  for (const l of leaves) {
    const share = l.pct / totalPct;
    if (!l.key) { unknownPct += share; contrib.push({ text: l.text, key: null, share, L: share * UNKNOWN_WF[1], blue: 0, unknown: true }); central += share * UNKNOWN_WF[1]; continue; }
    if (l.key === 'minor') minorPct += share;
    const w = WF[l.key];
    const tot = w.g + w.b + w.y;
    central += share * tot; centralBlue += share * w.b;
    contrib.push({ text: l.text, key: l.key, share, L: share * tot, blue: share * w.b });
  }
  // Monte Carlo
  const N = opts.n || 2000, r = mulberry32(opts.seed || 12345);
  const tot = [], blu = [];
  for (let s = 0; s < N; s++) {
    let sumShare = 0; const sh = [];
    for (const l of leaves) { const v = l.lo + (l.hi - l.lo) * r(); sh.push(v); sumShare += v; }
    let T = 0, B = 0;
    leaves.forEach((l, i) => {
      const share = sh[i] / (sumShare || 1);
      if (!l.key) { T += share * tri(r, UNKNOWN_WF[0], UNKNOWN_WF[1], UNKNOWN_WF[2]); return; }
      const w = WF[l.key], band = BANDS[w.band] || BANDS.crop;
      const f = tri(r, band[0], band[1], band[2]);
      T += share * (w.g + w.b + w.y) * f; B += share * w.b * f;
    });
    tot.push(T); blu.push(B);
  }
  tot.sort((a, b) => a - b); blu.sort((a, b) => a - b);
  contrib.sort((a, b) => b.L - a.L);
  const knownPct = 1 - unknownPct;
  return {
    perKg: { lo: pctile(tot, 0.1), mid: central, hi: pctile(tot, 0.9) },
    bluePerKg: { lo: pctile(blu, 0.1), mid: centralBlue, hi: pctile(blu, 0.9) },
    contrib, coverage: knownPct, minorPct,
    confidence: product.categoryFallback ? 'low' : knownPct >= 0.9 ? 'high' : knownPct >= 0.7 ? 'medium' : 'low',
    rating: rate(central / 10)
  };
}

/* scale per-kg result to a unit */
function scale(fp, grams) {
  const k = grams / 1000;
  const m = o => ({ lo: o.lo * k, mid: o.mid * k, hi: o.hi * k });
  return { total: m(fp.perKg), blue: m(fp.bluePerKg) };
}

/* ---------- 12. Swaps ---------- */
function swapOptions(product, fp) {
  const opts = [];
  const seen = new Set();
  for (const c of fp.contrib) {
    if (!c.key || seen.has(c.key) || !SWAPS[c.key]) continue;
    if (c.L / fp.perKg.mid < 0.12) continue; // only hotspots (>12% of footprint)
    seen.add(c.key);
    for (const rule of SWAPS[c.key]) {
      const res = applySwap(product, c.key, rule);
      if (res && res.savingPct > 0.08) opts.push(res);
    }
  }
  opts.sort((a, b) => b.savingPct - a.savingPct);
  // keep best option per hotspot ingredient, then fill up to 3
  const best = [], used = new Set();
  for (const o of opts) if (!used.has(o.from)) { best.push(o); used.add(o.from); }
  // a combined "rework the recipe" option when several hotspots can be swapped
  if (best.length >= 2) {
    const set = best.map(o => ({ from: o.parts[0].from, rule: SWAPS[o.parts[0].from].find(r => r.to === o.parts[0].to) }));
    const combo = applySwapSet(product, set);
    if (combo && combo.savingPct > best[0].savingPct + 0.05) best.unshift(combo);
  }
  for (const o of opts) if (best.length < 4 && !best.includes(o)) best.push(o);
  return best.slice(0, 4);
}

function applySwap(product, fromKey, rule) { return applySwapSet(product, [{ from: fromKey, rule }]); }

/* Apply one or more ingredient swaps at once. */
function applySwapSet(product, set) {
  const n = Object.assign({}, product.nutrition100 || {});
  const totalOld = product.ingredients.reduce((a, l) => a + l.pct, 0) || 100;
  let ings = product.ingredients.slice();
  let M = 1; const dN = [0, 0, 0];
  const parts = [];
  for (const { from, rule } of set) {
    const fromN = NUTR[from], toN = NUTR[rule.to];
    if (!fromN || !toN) return null;
    let ratio = 1;
    if (rule.mode === 'protein' && toN[1] > 0) ratio = Math.min(2.5, Math.max(1, fromN[1] / toN[1]));
    const sOld = ings.filter(l => l.key === from).reduce((a, l) => a + l.pct, 0) / totalOld;
    M += sOld * (ratio - 1);
    for (let i = 0; i < 3; i++) dN[i] += sOld * (toN[i] * ratio - fromN[i]);
    ings = ings.map(l => l.key === from
      ? Object.assign({}, l, { key: rule.to, text: WF[rule.to].label + ' (instead of ' + WF[from].label.toLowerCase() + ')', pct: l.pct * ratio,
          min: l.min != null ? l.min * ratio : null, max: l.max != null ? l.max * ratio : null, swapped: true })
      : l);
    parts.push({ from, to: rule.to, ratio, mode: rule.mode, look: rule.look, fromLabel: WF[from].label, toLabel: WF[rule.to].label });
  }
  const adj = (base, i) => base == null ? null : Math.max(0, (base + dN[i]) / M);
  Object.assign(n, { kcal: adj(n.kcal, 0), protein: adj(n.protein, 1), fibre: adj(n.fibre, 2) });
  const swapped = Object.assign({}, product, { ingredients: ings, nutrition100: n, swapOf: parts.map(p => p.from).join('+') });
  const fpNew = footprint(swapped), fpOld = footprint(product);
  const savingPct = 1 - fpNew.perKg.mid / fpOld.perKg.mid;
  const first = parts[0];
  return { parts, combined: parts.length > 1, from: parts.map(p => p.from).join('+'), to: parts.map(p => p.to).join('+'),
           fromLabel: parts.map(p => p.fromLabel).join(', '), toLabel: parts.map(p => p.toLabel).join(', '),
           ratio: first.ratio, mode: first.mode, look: parts.map(p => p.look).join('; '),
           product: swapped, fp: fpNew, savingPct };
}

/* ---------- 13. Comparisons ---------- */
function bestUnit(litresHi) {
  const U = k => UNITS.find(u => u.key === k);
  const tubs = litresHi / U('bathtub').L;
  if (tubs >= 0.5 && tubs <= 12) return U('bathtub');          // bathtubs are the headline comparison
  if (tubs < 0.5) return litresHi / U('shower').L >= 0.5 ? U('shower') : U('glass');
  return litresHi / U('hottub').L <= 15 ? U('hottub') : U('pool');
}

const api = { WF, BANDS, COMPOSITES, MATCHERS, NUTR, SWAPS, UNITS, RATING, CURATED, matchIngredient, normalizeBarcode,
              fromOFF, flattenOFF, footprint, scale, swapOptions, applySwap, applySwapSet, rate, bestUnit, curatedByName };
root.AquaEngine = api;
if (typeof module !== 'undefined') module.exports = api;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ===== AquaPrint UI ===== */
(function () {

/* ---------- number formatting ---------- */
function nice(x) {
  if (!isFinite(x)) return '–';

  if (x < 10) return x.toFixed(1);
  if (x < 100) return Math.round(x).toString();
  const mag = Math.pow(10, Math.floor(Math.log10(x)) - 1);
  return (Math.round(x / mag) * mag).toLocaleString('en-CA');
}
function niceCount(x) { return x < 10 ? (Math.round(x * 10) / 10).toString() : Math.round(x).toLocaleString('en-CA'); }
function rangeL(r) { return nice(r.lo) + ' – ' + nice(r.hi) + ' L'; }

function unitGrams(p, unit) {

}

             extra: '<path d="M14 4 H30 Q34 4 34 8 V12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M26 12 H42 L39 16 H29 Z" fill="currentColor"/><g fill="currentColor" opacity=".55"><circle cx="31" cy="19" r="1"/><circle cx="35" cy="19" r="1"/><circle cx="39" cy="19" r="1"/></g>' },
  bathtub: { vb: '0 0 72 52', body: 'M5 18 H67 V26 Q67 42 51 42 H21 Q5 42 5 26 Z', top: 18, bottom: 42,
             extra: '<path d="M12 18 V8 Q12 4 16 4 Q20 4 20 8" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><path d="M16 42 L13 49 M56 42 L59 49" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>' },
  hottub:  { vb: '0 0 72 52', body: 'M4 20 H68 V40 Q68 46 62 46 H10 Q4 46 4 40 Z', top: 20, bottom: 46,

  pool:    { vb: '0 0 80 50', body: 'M4 16 H76 V44 H4 Z', top: 16, bottom: 44,

};
let clipId = 0;
function vessel(key, fLo, fHi) {
  const s = SHAPES[key];
  const id = 'c' + (++clipId);
  const h = s.bottom - s.top;
  const yHi = s.bottom - h * fHi, yLo = s.bottom - h * fLo;

    '<defs><clipPath id="' + id + '"><path d="' + s.body + '"/></clipPath>' +
    '<pattern id="h' + id + '" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="var(--water-soft)"/><rect width="2.5" height="6" fill="var(--water-mid)"/></pattern></defs>' +
    '<g clip-path="url(#' + id + ')">' +
    (fHi > 0 ? '<rect x="0" y="' + yHi + '" width="100" height="' + (s.bottom - yHi) + '" fill="url(#h' + id + ')"/>' : '') +
    (fLo > 0 ? '<rect x="0" y="' + yLo + '" width="100" height="' + (s.bottom - yLo) + '" fill="var(--water)"/>' : '') +
    '</g><path d="' + s.body + '" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linejoin="round"/>' + s.extra + '</svg>';
}

function comparisonBlock(total) {
  const u = E.bestUnit(total.hi);
  const lo = total.lo / u.L, hi = total.hi / u.L;
  const n = Math.min(15, Math.max(1, Math.ceil(hi - 1e-9)));
  let icons = '';
  for (let i = 0; i < n; i++) icons += vessel(u.key, Math.max(0, Math.min(1, lo - i)), Math.max(0, Math.min(1, hi - i)));
  const others = E.UNITS.filter(x => x.key !== u.key && !(x.key === 'bathtub' && u.L > 150) && total.hi / x.L >= 0.3 && total.lo / x.L <= 5000)
    .map(x => '<li><b>' + niceCount(total.lo / x.L) + '–' + niceCount(total.hi / x.L) + '</b> ' + x.many + '</li>').join('');
  const tub = E.UNITS.find(x => x.key === 'bathtub');
  const bigger = u.L > tub.L;
  const head = bigger
    ? 'That’s about <b>' + niceCount(total.lo / tub.L) + '–' + niceCount(total.hi / tub.L) + ' bathtubs</b>'
    : 'That’s about <b>' + niceCount(lo) + '–' + niceCount(hi) + ' ' + (hi < 1.05 ? u.one : u.many) + '</b>';
  const caption = bigger ? '<div class="small">Shown as ' + u.many + ' (1 ' + u.one + ' ≈ ' + niceCount(u.L / tub.L) + ' bathtubs): ' + niceCount(lo) + '–' + niceCount(hi) + ' ' + u.many + '</div>' : '';
  return '<div class="compare">' +
    '<div class="compare-head">' + head + '</div>' + caption +
    '<div class="icons">' + icons + '</div>' +
    '<div class="legend"><span><i class="sw solid"></i>low estimate</span><span><i class="sw hatch"></i>up to high estimate</span></div>' +
    (others ? '<ul class="others">' + others + '</ul>' : '') +

}

function ratingScale(grade, size) {

}
function badge(grade) { return '<span class="badge g' + grade + '">' + grade + '</span>'; }

/* ---------- views ---------- */

    '<div class="card"><h3>Nutrition ' + esc(unitLabel(p, state.unit)) + '</h3><div class="nut">' +
      '<div><b>' + nut(n.kcal, '') + '</b><span>kcal</span></div><div><b>' + nut(n.protein, ' g') + '</b><span>protein</span></div>' +

    '<div class="card conf c-' + fp.confidence + '"><h3>' + conf + '</h3><p class="small">' +
      Math.round(fp.coverage * 100) + '% of the ingredients (by weight) were matched to published water-footprint data. ' + esc(p.shareNote || '') +
      ' The range (10th–90th percentile of 2,000 simulations) covers uncertainty in the recipe and differences between farming regions. Processing, packaging and transport water are not included.</p>' +
      '<button class="linkbtn" data-goto="method">How this is calculated →</button></div>' +
    '</section>';
}
function cap(s) { s = String(s || ''); return s.charAt(0).toUpperCase() + s.slice(1); }

function swapTitle(o, p) {
  const single = p.ingredients.filter(l => l.key && l.key !== 'water' && l.key !== 'minor').length === 1;
  const tos = [...new Set(o.parts.map(x => x.toLabel.toLowerCase()))];
  if (single) return 'Try ' + tos.join(' or ') + ' instead';
  if (o.combined) return 'Rework the recipe: ' + tos.join(' & ');
  return 'Swap ' + o.parts[0].fromLabel.toLowerCase() + ' for ' + o.parts[0].toLabel.toLowerCase();
}

function swapModal() {
  const p = state.product, g = unitGrams(p, state.unit);
  const base = E.scale(state.fp, g).total;
  const n0 = p.nutrition100 || {};
  const cards = state.swaps.map((o, i) => {
    const sc = E.scale(o.fp, g).total;
    const n1 = o.product.nutrition100;
    const savedLo = Math.max(0, base.lo - sc.lo), savedHi = Math.max(0, base.hi - sc.hi);
    const row = (lab, a, b, u) => {
      if (a == null || b == null) return '';
      const A = a * g / 100, B = b * g / 100, d = B - A;
      const cls = Math.abs(d) / Math.max(A, 0.01) < 0.1 ? 'same' : d > 0 ? 'up' : 'down';
      return '<tr><td>' + lab + '</td><td>' + nice(A) + u + '</td><td class="' + cls + '">' + nice(B) + u + '</td></tr>';
    };
    const detail = o.parts.map(x => '<li>' + esc(x.fromLabel) + ' → <b>' + esc(x.toLabel) + '</b>' +
      (x.ratio > 1.05 ? ' <span class="small">(' + x.ratio.toFixed(1) + '× the amount, to keep protein similar)</span>' : '') + '</li>').join('');
    return '<div class="scard' + (i === 0 ? ' best' : '') + '">' +
      (i === 0 ? '<div class="tag">Biggest saving</div>' : '') +
      '<h3>' + esc(swapTitle(o, p)) + '</h3><ul class="swaplist">' + detail + '</ul>' +
      '<div class="svs"><div><span>Now</span><b>' + rangeL(base) + '</b>' + badge(state.fp.rating.grade) + '</div><div class="arrow">→</div>' +
      '<div><span>With swap</span><b>' + rangeL(sc) + '</b>' + badge(o.fp.rating.grade) + '</div></div>' +
      '<div class="saving">Saves about <b>' + Math.round(o.savingPct * 100) + '%</b>: ' + nice(savedLo) + '–' + nice(savedHi) + ' L, roughly <b>' + niceCount(savedLo / 150) + '–' + niceCount(savedHi / 150) + ' bathtubs</b> ' + unitLabel(p, state.unit) + '</div>' +
      '<table class="ntab"><tr><th></th><th>Now</th><th>Swap</th></tr>' + row('Protein', n0.protein, n1.protein, ' g') + row('Fibre', n0.fibre, n1.fibre, ' g') + row('Energy', n0.kcal, n1.kcal, ' kcal') + '</table>' +
      '<p class="small">Look for: ' + esc(o.look) + '.</p>' +
      '<button class="btn primary addswap" data-i="' + i + '">＋ Add swap to grocery list</button></div>';
  }).join('');
  return '<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true" aria-label="Lower-water swaps">' +
    '<button class="x" id="closeModal" aria-label="Close">×</button>' +
    '<div class="mhead">' + DROP + '<div><h2>Lower-water options</h2><p class="small">Similar nutrition, less water. ' + esc(cap(unitLabel(p, state.unit))) + '.</p></div></div>' +
    cards + '</div></div>';
}

function listView() {
  const items = state.list;
  if (!items.length) return '<section class="list"><h1>Grocery list</h1><div class="empty">' + DROP + '<p>Your list is empty.<br>Scan an item and tap <b>Add to grocery list</b>.</p><button class="btn primary" data-goto="scan">Scan an item</button></div></section>';
  let tLo = 0, tHi = 0, bLo = 0, bHi = 0, sLo = 0, sHi = 0, anySwap = false;
  const rows = items.map((it, i) => {
    const q = it.qty || 1;
    tLo += it.lo * q; tHi += it.hi * q; bLo += it.blueLo * q; bHi += it.blueHi * q;
    if (it.swap) { anySwap = true; sLo += Math.max(0, it.lo - it.swap.lo) * q; sHi += Math.max(0, it.hi - it.swap.hi) * q; }
    return '<div class="li">' + badge(it.grade) +
      '<div class="li-m"><b>' + esc(it.emoji || '🛒') + ' ' + esc(it.name) + '</b><span>' + nice(it.lo * q) + '–' + nice(it.hi * q) + ' L' + (it.isSwap ? ' · lower-water swap' : '') + '</span>' +
      (it.swap ? '<button class="linkbtn useswap" data-i="' + i + '">💧 Swap to save ~' + Math.round(it.swap.pct * 100) + '%</button>' : '') + '</div>' +
      '<div class="qty"><button data-q="-1" data-i="' + i + '" aria-label="Fewer">−</button><span>' + q + '</span><button data-q="1" data-i="' + i + '" aria-label="More">＋</button></div></div>';
  }).join('');
  const u = E.bestUnit(tHi);
  return '<section class="list"><h1>Grocery list</h1>' +
    '<div class="card total"><span class="small">Water footprint of this list</span><div class="big">' + nice(tLo) + ' – ' + nice(tHi) + ' L</div>' +
    '<div class="sub">≈ ' + niceCount(tLo / 150) + '–' + niceCount(tHi / 150) + ' bathtubs · blue (irrigation) water ' + nice(bLo) + '–' + nice(bHi) + ' L</div>' +
    (anySwap ? '<div class="potential">💧 Taking the suggested swaps would save about <b>' + nice(sLo) + '–' + nice(sHi) + ' L</b> (' + niceCount(sLo / 150) + '–' + niceCount(sHi / 150) + ' bathtubs).</div>' : '') +
    comparisonBlock({ lo: tLo, hi: tHi }) + '</div>' +
    '<div class="items">' + rows + '</div>' +
    '<div class="actions"><button class="btn" id="copyList">Copy list</button><button class="btn ghost" id="clearList">Clear list</button></div>' +
    '<p class="small center" id="copyMsg"></p></section>';
}

function methodView() {
  const rows = Object.entries(E.WF).filter(([k]) => !['water', 'minor'].includes(k)).sort((a, b) => (b[1].g + b[1].b + b[1].y) - (a[1].g + a[1].b + a[1].y))
    .map(([k, w]) => '<tr><td>' + esc(w.label) + '</td><td>' + (w.g + w.b + w.y).toLocaleString('en-CA') + '</td><td>' + w.b.toLocaleString('en-CA') + '</td><td class="src">' + esc(w.src) + '</td></tr>').join('');
  return '<section class="method"><h1>How AquaPrint works</h1>' +
    '<div class="card"><h3>1 · Identify the product</h3><p>The barcode is looked up in <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">Open Food Facts</a>, a free, open database of 3+ million food products. It gives the ingredient list (with estimated percentages), nutrition facts and package size.</p></div>' +
    '<div class="card"><h3>2 · Match ingredients to water data</h3><p>Each ingredient is matched to the global-average water footprint published by the Water Footprint Network (Mekonnen &amp; Hoekstra). Footprints are split into <b>green</b> (rain), <b>blue</b> (irrigation from rivers, lakes and aquifers) and <b>grey</b> (water needed to dilute pollution). Water added during cooking/canning, salt and additives are not counted.</p></div>' +
    '<div class="card"><h3>3 · Calculate a range, not a single number</h3><p>Water footprints vary a lot between farms and countries, and most labels don’t state ingredient percentages. AquaPrint runs 2,000 simulations, each time drawing ingredient shares within their plausible range and a farming-region multiplier for each ingredient:</p>' +
      '<ul class="small"><li>Crops: 0.7–1.4× the global average</li><li>Tree nuts: 0.55–1.35×</li><li>Cocoa, coffee &amp; tea: 0.6–1.45×</li><li>Animal products: 0.6–1.5×</li></ul>' +
      '<p>The range shown is the 10th–90th percentile of those simulations. Unrecognised ingredients get a wide generic estimate (300–4,000 L/kg) and lower the confidence rating.</p></div>' +
    '<div class="card"><h3>4 · The AquaPrint rating</h3><p>Based on litres per 100 g (most likely value), the same basis a packaging label would use:</p>' +
      '<table class="rtab">' + E.RATING.map((r, i) => '<tr><td>' + badge(r.grade) + '</td><td>' + r.label + '</td><td>' + (i === 0 ? '≤ ' + r.max : r.max === Infinity ? '> ' + E.RATING[i - 1].max : E.RATING[i - 1].max + '–' + r.max) + ' L / 100 g</td></tr>').join('') + '</table></div>' +
    '<div class="card"><h3>5 · Swaps</h3><p>When one ingredient makes up a big share of the footprint, AquaPrint suggests a lower-water ingredient. Protein foods (e.g. beef → lentils) are scaled so protein stays about the same; others are swapped gram for gram. Nutrition changes use USDA FoodData Central values.</p></div>' +
    '<div class="card"><h3>Everyday comparisons</h3><ul class="small">' + E.UNITS.map(u => '<li><b>' + cap(u.one) + '</b> ≈ ' + u.L.toLocaleString('en-CA') + ' L (' + u.note + ')</li>').join('') + '</ul></div>' +
    '<div class="card"><h3>Limitations</h3><ul class="small"><li>Global averages: a product’s real footprint depends on where its ingredients were grown, which labels rarely say.</li><li>Covers farming water only, not processing, packaging or transport (usually a small share for food).</li><li>Green water is rain that would fall anyway; blue water is the part that competes with people and ecosystems, so AquaPrint always shows it separately.</li><li>Open Food Facts is crowd-sourced; some products are missing or incomplete.</li></ul></div>' +
    '<div class="card"><h3>Sources</h3><ul class="small src-list">' +
      '<li>Mekonnen, M.M. &amp; Hoekstra, A.Y. (2011). The green, blue and grey water footprint of crops and derived crop products. <i>Hydrology and Earth System Sciences</i> 15, 1577–1600. <a href="https://www.waterfootprint.org/resources/Report47-WaterFootprintCrops-Vol1.pdf" target="_blank" rel="noopener">Report 47</a></li>' +
      '<li>Mekonnen, M.M. &amp; Hoekstra, A.Y. (2012). A global assessment of the water footprint of farm animal products. <i>Ecosystems</i> 15, 401–415. <a href="https://www.waterfootprint.org/resources/Report-48-WaterFootprint-AnimalProducts-Vol1.pdf" target="_blank" rel="noopener">Report 48</a></li>' +
      '<li>Fulton, J. et al. (2018). Water-indexed benefits and impacts of California almonds. <i>Ecological Indicators</i>.</li>' +
      '<li>Open Food Facts product database (ODbL). <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a></li>' +
      '<li>USDA FoodData Central, nutrient values for swap comparisons.</li></ul></div>' +
    '<details class="card"><summary><h3>Ingredient water table (litres per kg)</h3></summary><div class="tscroll"><table class="wtab"><tr><th>Ingredient</th><th>Total</th><th>Blue</th><th>Source</th></tr>' + rows + '</table></div></details>' +
    '<p class="small center">AquaPrint is a proof of concept built for QUESST 2026. Estimates are indicative, not certified.</p></section>';
}

/* ---------- lookup ---------- */
function validEAN(code) {
  const d = code.replace(/\D/g, '');
  if (![8, 12, 13, 14].includes(d.length)) return false;
  const digits = d.split('').map(Number), check = digits.pop();
  let sum = 0;
  digits.reverse().forEach((x, i) => { sum += x * (i % 2 === 0 ? 3 : 1); });
  return (10 - (sum % 10)) % 10 === check;
}

async function lookup(raw) {
  const code = /^DEMO|^CUSTOM/.test(raw) ? raw : E.normalizeBarcode(raw);
  showMsg('Looking up ' + (/^DEMO/.test(code) ? 'product' : code) + '…', 'info');
  let product = null;
  if (E.CURATED[code]) product = Object.assign({ code, curated: true }, E.CURATED[code]);
  else {
    try {
      const fields = 'code,product_name,product_name_en,generic_name,brands,quantity,product_quantity,serving_size,serving_quantity,nutriments,ingredients,categories,categories_tags,image_front_small_url,image_front_url';
      const res = await fetch('https://world.openfoodfacts.org/api/v2/product/' + encodeURIComponent(code) + '.json?fields=' + fields);
      const data = await res.json();
      if (data.status === 1 && data.product) product = E.fromOFF(Object.assign({ code }, data.product));
      else { notFound(code); return; }
    } catch (e) {
      showMsg('Couldn’t reach the Open Food Facts database' + (location.hostname.includes('claude') ? ' from this preview (live lookups need the hosted version).' : '. Check your connection and try again.') + ' The example products below work offline.', 'warn');
      return;
    }
  }
  if (!product.ingredients || !product.ingredients.length) { notFound(code, product); return; }
  showProduct(product);
}

function showProduct(product) {
  state.product = product;
  state.fp = E.footprint(product);
  state.swaps = E.swapOptions(product, state.fp);
  state.unit = product.grams ? 'package' : '100g';
  state.view = 'result';
  state.recent = [{ code: product.code, name: product.name, emoji: product.emoji }].concat(state.recent.filter(r => r.code !== product.code)).slice(0, 8);
  if (!/^CUSTOM/.test(product.code)) store.set('recent', state.recent);
  render();
  if (state.swaps.length && 'DE'.includes(state.fp.rating.grade)) setTimeout(openSwaps, 900);
}

function notFound(code, partial) {
  state.view = 'scan'; render();
  const opts = Object.entries(E.WF).filter(([k]) => !['water', 'minor'].includes(k)).sort((a, b) => a[1].label.localeCompare(b[1].label))
    .map(([k, w]) => '<option value="' + k + '">' + esc(w.label) + '</option>').join('');
  showMsg((partial ? '<b>' + esc(partial.name) + '</b> was found, but it has no ingredient list in Open Food Facts yet.' : 'Barcode <b>' + esc(code) + '</b> isn’t in Open Food Facts yet.') +
    '<br>You can still get a rough estimate: what is it mostly made of?' +
    '<form id="quick" class="quick"><select id="qKey">' + opts + '</select><input id="qG" inputmode="decimal" placeholder="grams" value="' + (partial && partial.grams ? partial.grams : '') + '"><button class="btn primary" type="submit">Estimate</button></form>' +
    '<p class="small">Help everyone by adding it at <a href="https://world.openfoodfacts.org" target="_blank" rel="noopener">openfoodfacts.org</a>.</p>', 'warn', true);
}

function showMsg(html, kind, isHtml) {
  const m = $('#scanMsg'); if (!m) return;
  m.className = 'msg ' + (kind || 'info');
  if (isHtml) m.innerHTML = html; else m.textContent = html;
}

/* ---------- camera ---------- */
let scanner = null;
function formats() {
  const F = window.Html5QrcodeSupportedFormats;
  return F ? [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E] : undefined;
}
async function startCamera() {
  if (!window.Html5Qrcode) { showMsg('The scanner library didn’t load. Check your connection, or type the barcode below.', 'warn'); return; }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { showMsg('Camera isn’t available here. Use “Scan from a photo” or type the barcode.', 'warn'); return; }
  try {
    $('#camIdle').classList.add('hidden');
    $('#stopCam').classList.remove('hidden');
    scanner = new Html5Qrcode('reader', { formatsToSupport: formats(), experimentalFeatures: { useBarCodeDetectorIfSupported: true }, verbose: false });
    state.scanning = true;
    await scanner.start({ facingMode: 'environment' },
      { fps: 12, qrbox: (w, h) => ({ width: Math.floor(Math.min(w * 0.88, 340)), height: Math.floor(Math.min(h * 0.5, 170)) }), aspectRatio: 1.333 },
      onDecoded, () => {});
  } catch (e) {
    state.scanning = false;
    const blocked = /Permission|NotAllowed|denied|policy/i.test(String(e && (e.name || e.message || e)));
    showMsg(blocked ? 'Camera access was blocked. Allow camera access for this site, or use “Scan from a photo”.' : 'Couldn’t start the camera. Use “Scan from a photo” or type the barcode.', 'warn');
    const idle = $('#camIdle'); if (idle) idle.classList.remove('hidden');
    const st = $('#stopCam'); if (st) st.classList.add('hidden');
  }
}
async function stopCamera() {
  if (scanner && state.scanning) { state.scanning = false; try { await scanner.stop(); scanner.clear(); } catch (e) { /* ignore */ } }
}
let lastCode = '', lastTime = 0;
function onDecoded(text) {
  const now = Date.now();
  if (!validEAN(text)) return;                 // ignore misreads
  if (text === lastCode && now - lastTime < 3000) return;
  lastCode = text; lastTime = now;
  if (navigator.vibrate) try { navigator.vibrate(60); } catch (e) { /* ignore */ }
  stopCamera().then(() => lookup(text));
}
async function scanPhoto(file) {
  if (!window.Html5Qrcode) { showMsg('The scanner library didn’t load. Type the barcode instead.', 'warn'); return; }
  showMsg('Reading barcode from photo…', 'info');
  try {
    const fr = new Html5Qrcode('fileReader', { formatsToSupport: formats(), verbose: false });
    const text = await fr.scanFile(file, false);
    try { fr.clear(); } catch (e) { /* ignore */ }
    lookup(text);
  } catch (e) {
    showMsg('No barcode found in that photo. Try a closer, sharper photo with the barcode filling most of the frame, or type the digits.', 'warn');
  }
}

/* ---------- list ---------- */
function listItemFrom(product, fp, swaps, isSwap) {
  const g = product.grams || product.servingGrams || 100;
  const sc = E.scale(fp, g);
  const best = swaps && swaps[0];
  let swap = null;
  if (best) { const s2 = E.scale(best.fp, g).total; swap = { lo: s2.lo, hi: s2.hi, pct: best.savingPct, product: slim(best.product), grade: best.fp.rating.grade }; }
  return { id: Date.now() + Math.random(), code: product.code, name: product.name + (/\d\s?k?g\b/.test(product.name) ? '' : product.grams ? ' (' + fmtGrams(product.grams) + ')' : ' (100 g)'), emoji: product.emoji,
           grade: fp.rating.grade, lo: sc.total.lo, hi: sc.total.hi, blueLo: sc.blue.lo, blueHi: sc.blue.hi, qty: 1, swap, isSwap: !!isSwap };
}
function slim(p) { return { name: p.name, brand: p.brand, grams: p.grams, servingGrams: p.servingGrams, emoji: p.emoji, ingredients: p.ingredients, nutrition100: p.nutrition100 }; }
function saveList() { store.set('list', state.list); $('#listCount').textContent = state.list.length || ''; }
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2200); }

/* ---------- modal ---------- */
function openSwaps() {
  if (!state.swaps.length || state.view !== 'result' || $('#modalBg')) return;
  document.body.insertAdjacentHTML('beforeend', swapModal());
  document.body.classList.add('noscroll');
}
function closeModal() { const m = $('#modalBg'); if (m) m.remove(); document.body.classList.remove('noscroll'); }

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, .tab, [data-goto]');
  if (!t) { if (e.target.id === 'modalBg') closeModal(); return; }
  if (t.classList.contains('tab')) { closeModal(); state.view = t.dataset.view; render(); return; }
  if (t.dataset.goto) { closeModal(); state.view = t.dataset.goto; render(); return; }
  if (t.dataset.code) { lookup(t.dataset.code); return; }
  if (t.id === 'startCam') { startCamera(); return; }
  if (t.id === 'stopCam') { stopCamera().then(() => { state.view = 'scan'; render(); }); return; }
  if (t.id === 'back') { state.view = 'scan'; render(); return; }
  if (t.dataset.unit) { state.unit = t.dataset.unit; render(); return; }
  if (t.id === 'openSwaps') { openSwaps(); return; }
  if (t.id === 'closeModal') { closeModal(); return; }
  if (t.id === 'addList') { state.list.push(listItemFrom(state.product, state.fp, state.swaps)); saveList(); toast('Added to your grocery list'); return; }
  if (t.classList.contains('addswap')) {
    const o = state.swaps[+t.dataset.i];
    const tos = [...new Set(o.parts.map(x => x.toLabel.toLowerCase()))];
    const p = Object.assign({}, o.product, { name: state.product.name.split(' –')[0] + ' (with ' + tos.join(' & ') + ')', code: 'SWAP' });
    state.list.push(listItemFrom(p, o.fp, [], true)); saveList(); closeModal(); toast('Swap added to your grocery list'); return;
  }
  if (t.classList.contains('useswap')) {
    const it = state.list[+t.dataset.i];
    if (it && it.swap) {
      const p = it.swap.product;
      const fp = E.footprint(p);
      const repl = listItemFrom(Object.assign({}, p, { name: it.name.replace(/ \([^)]*\)$/, '') + ' – lower-water version', code: 'SWAP' }), fp, [], true);
      repl.qty = it.qty; repl.grade = it.swap.grade;
      state.list[+t.dataset.i] = repl; saveList(); render(); toast('Swapped – nice!');
    }
    return;
  }
  if (t.dataset.q) {
    const it = state.list[+t.dataset.i]; if (!it) return;
    it.qty = (it.qty || 1) + (+t.dataset.q);
    if (it.qty <= 0) state.list.splice(+t.dataset.i, 1);
    saveList(); render(); return;
  }
  if (t.id === 'clearList') {
    if (t.dataset.armed) { state.list = []; saveList(); render(); }
    else { t.dataset.armed = '1'; t.textContent = 'Tap again to clear'; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = 'Clear list'; } }, 3000); }
    return;
  }
  if (t.id === 'copyList') {
    const lines = state.list.map(it => '- ' + (it.qty > 1 ? it.qty + ' × ' : '') + it.name + ' [' + it.grade + '] ' + nice(it.lo * it.qty) + '–' + nice(it.hi * it.qty) + ' L');
    const txt = 'AquaPrint grocery list\n' + lines.join('\n');
    const done = () => { $('#copyMsg').textContent = 'Copied!'; };
    try { navigator.clipboard.writeText(txt).then(done, () => { $('#copyMsg').textContent = 'Copy isn’t allowed here.'; }); } catch (err) { $('#copyMsg').textContent = 'Copy isn’t allowed here.'; }
    return;
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  if (e.target.id === 'manual') {
    const v = $('#codeIn').value.trim();
    if (!/^\d{8,14}$/.test(v.replace(/\s/g, ''))) { showMsg('Enter the 8–13 digits under the barcode.', 'warn'); return; }
    lookup(v.replace(/\s/g, ''));
  }
  if (e.target.id === 'quick') {
    const key = $('#qKey').value, g = parseFloat($('#qG').value) || 100;
    showProduct({ code: 'CUSTOM-' + key, name: E.WF[key].label + ' (rough estimate)', brand: 'Estimated by type', emoji: '🧮', grams: g, servingGrams: null,
      nutrition100: Object.fromEntries(['kcal', 'protein', 'fibre'].map((k, i) => [k, E.NUTR[key] ? E.NUTR[key][i] : null])),
      ingredients: [{ text: E.WF[key].label, key, pct: 100, min: 100, max: 100 }], shareNote: 'Treated as a single ingredient – a rough estimate only.' });
  }
});
document.addEventListener('change', e => { if (e.target.id === 'fileIn' && e.target.files[0]) scanPhoto(e.target.files[0]); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

render();
})();

</script>
</body>
</html>
